org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Hard stops so a stalled TLS connection fails loudly instead of hanging the build for minutes.
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=20000
systemProp.org.gradle.internal.repository.max.retries=2
systemProp.org.gradle.internal.repository.initial.backoff=500
# Direct connections to Google Maven stall part way through large artifacts on this machine; the
# local HTTP proxy is stable, so route the build through it.
